name: Bug report
description: Report a reproducible defect that is not a security vulnerability
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not report security vulnerabilities here. Follow SECURITY.md and use
        GitHub private vulnerability reporting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence without sensitive data.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, deployment method, database, and relevant integration versions.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, personal data, customer data, and internal URLs.
      render: shell
