name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.26.x
          - 1.27.x

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.mod

      - name: Verify
        run: make check

      - name: Run race detector
        if: matrix.go == '1.27.x'
        run: make test-race

  database:
    # Keep this job name stable: main branch protection requires this check.
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
          cache-dependency-path: go.sum

      - name: Verify migrations and queue semantics
        env:
          OPEN_ASPM_TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: make test-integration

  blobstore:
    name: S3 BlobStore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MINIO_SOURCE_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a # RELEASE.2025-10-15T17-29-55Z

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
          cache-dependency-path: go.sum

      - name: Build pinned MinIO
        run: |
          minio_build_dir="${RUNNER_TEMP}/open-aspm-minio"
          mkdir -p "${minio_build_dir}/bin"
          GOBIN="${minio_build_dir}/bin" \
            go install "github.com/minio/minio@${MINIO_SOURCE_COMMIT}"

      - name: Verify S3 BlobStore conformance
        env:
          OPEN_ASPM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          OPEN_ASPM_TEST_S3_ACCESS_KEY: minioadmin
          OPEN_ASPM_TEST_S3_SECRET_KEY: minioadmin123
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        run: |
          set -euo pipefail
          minio_build_dir="${RUNNER_TEMP}/open-aspm-minio"
          mkdir -p "${minio_build_dir}/data"
          "${minio_build_dir}/bin/minio" server "${minio_build_dir}/data" \
            --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 \
            >"${minio_build_dir}/minio.log" 2>&1 &
          minio_pid=$!
          cleanup() {
            if kill -0 "${minio_pid}" 2>/dev/null; then
              kill "${minio_pid}" || true
              wait "${minio_pid}" || true
            fi
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then
              ready=true
              break
            fi
            if ! kill -0 "${minio_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            cat "${minio_build_dir}/minio.log"
            exit 1
          fi

          make test-s3-integration
