name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.26.x
          - 1.27.x

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.mod

      - name: Verify
        run: make check

      - name: Run race detector
        if: matrix.go == '1.27.x'
        run: make test-race

  database:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
          cache-dependency-path: go.sum

      - name: Verify migrations with non-superuser roles
        env:
          OPEN_ASPM_TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: make test-integration

  blobstore:
    name: S3 BlobStore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
          cache-dependency-path: go.sum

      - name: Start isolated MinIO
        run: >-
          docker run --detach --rm
          --name open-aspm-minio
          --publish 127.0.0.1:9000:9000
          --env MINIO_ROOT_USER=minioadmin
          --env MINIO_ROOT_PASSWORD=minioadmin123
          quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          server /data

      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs open-aspm-minio
          exit 1

      - name: Verify S3 BlobStore conformance
        env:
          OPEN_ASPM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          OPEN_ASPM_TEST_S3_ACCESS_KEY: minioadmin
          OPEN_ASPM_TEST_S3_SECRET_KEY: minioadmin123
        run: make test-s3-integration

      - name: Stop isolated MinIO
        if: always()
        run: docker stop open-aspm-minio || true
